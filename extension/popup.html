<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>优诺本地翻译插件</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup-body"><main class="popup-shell">
  <header class="app-bar"><div class="brand-lockup"><span class="brand-mark" aria-hidden="true">优</span><div><h1>优诺翻译</h1><p>LOCAL · OLLAMA</p></div></div><button id="openOptions" class="plain-icon" title="设置" aria-label="打开设置">设置</button></header>
  <section class="workspace" aria-label="翻译控制台">
    <div class="field-label"><span>语言方向</span><span class="field-hint">自动检测可用</span></div>
    <div class="language-row"><label><span class="sr-only">原文语言</span><select id="sourceLanguage"><option value="auto">自动检测</option><option value="en">英语</option><option value="zh">简体中文</option><option value="ja">日语</option><option value="ko">韩语</option></select></label><span class="direction-arrow" aria-hidden="true">→</span><label><span class="sr-only">译文语言</span><select id="targetLanguage"><option value="zh">简体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></label></div>
    <button id="translatePage" class="translate-cta"><span class="cta-copy"><strong>开始自动翻译</strong><small id="modelCaption">Qwen2.5 3B · 跟随页面变化</small></span><span class="cta-arrow" aria-hidden="true">→</span></button>
    <div class="reading-row"><span>阅读显示</span><div class="segmented" role="group" aria-label="阅读显示"><button id="showOriginal">显示原文</button><button id="showTranslation" class="active">显示译文</button></div></div>
  </section>
  <footer id="status" class="status" aria-live="polite"><span class="status-light"></span><span>准备就绪</span><span class="status-tail">本机运行</span></footer>
</main><script src="popup.js"></script></body></html>
