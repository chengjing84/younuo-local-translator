<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>优诺本地翻译插件</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="ui-compact.css">
  <link rel="stylesheet" href="ui-rounded.css">
</head>
<body class="popup-body">
  <main class="popup-shell">
    <header class="mascot-hero">
      <div class="hero-copy">
        <p class="eyebrow">LOCAL QWEN TRANSLATOR</p>
        <h1>优诺<span class="brand-dot">。</span></h1>
        <p class="hero-note">本机翻译，文字不出电脑</p>
      </div>
      <button id="openOptions" class="icon-button hero-settings" title="设置" aria-label="打开设置">⚙</button>
      <span class="version-chip">v0.4.2</span>
    </header>

    <section class="control-stack">
      <div class="section-heading"><span class="step-number">01</span><span>选择语言</span></div>
      <div class="direction-card">
        <label>
          <span>原文</span>
          <select id="sourceLanguage">
            <option value="auto">自动检测</option>
            <option value="en">英语</option>
            <option value="zh">简体中文</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
          </select>
        </label>
        <span class="direction-arrow" aria-hidden="true">→</span>
        <label>
          <span>译文</span>
          <select id="targetLanguage">
            <option value="zh">简体中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
          </select>
        </label>
      </div>

      <div class="section-heading"><span class="step-number">02</span><span>开始工作</span></div>
      <button id="translatePage" class="translate-cta">
        <span class="cta-glyph">优</span>
        <span class="cta-copy">
          <strong>翻译当前网页</strong>
          <small id="modelCaption">Qwen2.5 3B · 跟随页面滚动</small>
        </span>
        <span class="cta-arrow">↗</span>
      </button>

      <div class="section-heading compact-heading"><span class="step-number">03</span><span>阅读内容</span></div>
      <div class="segmented" role="group" aria-label="阅读内容">
        <button id="showOriginal">原文</button>
        <button id="showTranslation" class="active">译文</button>
      </div>
    </section>

    <footer id="status" class="status" aria-live="polite">
      <span class="status-light"></span>
      <span>准备就绪</span>
      <span class="status-tail">本机运行</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
