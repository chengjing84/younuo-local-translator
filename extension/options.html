<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>优诺翻译设置</title><link rel="stylesheet" href="ui.css"></head>
<body class="options-body"><main class="page-shell">
  <header class="page-header"><p class="eyebrow">YOUNUO / SETTINGS</p><h1>翻译设置</h1><p class="lede">模型和术语仅保存在当前 Edge 本机配置中。</p></header>
  <section class="panel"><h2>默认模型</h2><p class="panel-copy">选择用于网页翻译、划词翻译与润色的本机 Qwen 模型。</p><div class="form-grid"><label class="field"><span>Qwen 模型</span><select id="qwenModel"><option value="qwen2.5:3b">Qwen2.5 3B</option><option value="qwen3:1.7b">Qwen3 1.7B</option></select></label></div></section>
  <section class="panel"><h2>固定译法</h2><p class="panel-copy">命中原词时，优先使用指定译文。</p><table class="table"><thead><tr><th>原词</th><th>固定译文</th><th></th></tr></thead><tbody id="fixedRows"></tbody></table><div class="actions"><button id="addFixed" class="secondary">添加固定译法</button></div></section>
  <section class="panel"><h2>不翻译的词</h2><p class="panel-copy">品牌、变量名和专有名词可保持原样，每行一个。</p><label class="field full"><textarea id="protectedTerms" rows="6" placeholder="OpenAI&#10;TypeScript&#10;YouNuo"></textarea></label><div class="actions"><button id="save" class="primary">保存设置</button><button id="export" class="secondary">导出 JSON</button><label class="secondary file-button">导入 JSON<input id="import" type="file" accept=".json" hidden></label></div><p id="saveStatus" class="save-status"></p></section>
</main><script src="options.js"></script></body></html>
